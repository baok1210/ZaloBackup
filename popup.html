<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #f8f9fa; text-align: center; }
h3 { font-size: 14px; margin-bottom: 12px; color: #333; }
p { font-size: 12px; color: #666; margin-bottom: 12px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; background: #0068ff; color: white; }
.btn:hover { background: #0052cc; }
</style>
</head>
<body>
<h3>Zalo Message Backup</h3>
<p>Mo chat.zalo.me roi click nut 📦 o goc duoi ben phai de bat dau backup.</p>
<button class="btn" id="toggleBtn">Hien/An nut backup</button>
<script>
document.getElementById('toggleBtn').addEventListener('click', async () => {
  const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
  if (tab && tab.url?.includes('chat.zalo.me')) {
    chrome.tabs.sendMessage(tab.id, { action: 'toggleUI' });
  }
});
</script>
</body>
</html>
